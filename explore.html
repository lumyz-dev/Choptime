<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Page</title> <link rel="stylesheet" href="explore.css" />
</head>
<body>
    <!-- nav bar -->
    <nav>
      <div class="nav">
        <!-- logo -->
        <div class="headest">
          <img src="choptime-footer-logo.jpg" alt="Choptime logo" />
          <p class="logo">Choptime</p>
        </div>
        <div class="searchbar-wrapper">
          <!-- searchbar -->

          <svg
            class="search-icon"
            xmlns="
http://www.w3.org/2000/svg
"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-search"
            viewBox="0 0 16 16"
          >
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
            />
          </svg>

          <input
            id="input1"
            type="text"
            placeholder="Search jollof, suya, soups..."
          />
        </div>
        <div>
          <!-- navlinks -->
          <div class="navlinks">
            <a href="#home">Home</a>
            <a href="#explore">Explore</a>
            <a href="#orders">My Orders</a>
          </div>
        </div>
        <!-- myaccount -->
        <div class="myaccount">
          <div class="icn-btn-cont">
            <!-- button used by user to open modal -->
            <button class="icn-btn" id="openBtn">
              <svg
                xmlns="
http://www.w3.org/2000/svg
"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-bag"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"
                />
              </svg>
            </button>
          </div>
          <div>
            <img src="Profile.png" alt="profile photo" />
          </div>
        </div>
      </div>
    </nav>
    <header></header>
</body>
</html>
